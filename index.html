<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGDVN - Cartoon Realtime Chat</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Nunito (Giao diện Cartoon) -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #fef08a; /* Bright yellow cartoon background */
      background-image: radial-gradient(#facc15 2px, transparent 2px);
      background-size: 24px 24px;
    }
    
    .font-cartoon {
      font-family: 'Fredoka', cursive;
    }

    /* Custom Cartoon Border & Shadows */
    .cartoon-border {
      border: 3px solid #0f172a;
    }

    .cartoon-shadow {
      box-shadow: 4px 4px 0px #0f172a;
    }

    .cartoon-shadow-lg {
      box-shadow: 6px 6px 0px #0f172a;
    }

    .cartoon-shadow-btn {
      box-shadow: 0px 5px 0px #0f172a;
      transition: all 0.1s ease;
    }
    .cartoon-shadow-btn:active {
      transform: translateY(4px);
      box-shadow: 0px 1px 0px #0f172a;
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes popIn {
      0% { transform: scale(0.6) translateY(20px); opacity: 0; }
      80% { transform: scale(1.05) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    .animate-pop-in {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .animate-wiggle:hover {
      animation: wiggle 0.25s infinite;
    }

    /* Custom Scrollbar */
    .chat-scroll::-webkit-scrollbar {
      width: 10px;
    }
    .chat-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
      border: 2px solid #0f172a;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 10px;
      border: 2px solid #0f172a;
    }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden select-none">

  <!-- MAIN APP CONTAINER -->
  <div class="w-full max-w-5xl h-full max-h-[92vh] bg-white cartoon-border cartoon-shadow-lg rounded-3xl flex flex-col overflow-hidden relative">

    <!-- TOP HEADER BAR -->
    <header class="bg-amber-400 border-b-4 border-slate-900 px-4 py-3 flex justify-between items-center z-10">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-pink-500 cartoon-border cartoon-shadow flex items-center justify-center text-2xl text-white animate-float">
          💬
        </div>
        <div>
          <h1 class="font-cartoon text-2xl sm:text-3xl font-bold text-slate-900 leading-none tracking-wide">
            ChatGDVN<span class="text-pink-600">!</span>
          </h1>
          <p class="text-xs font-bold text-slate-800 flex items-center gap-1.5 mt-0.5">
            <span id="status-dot" class="w-3 h-3 rounded-full bg-gray-400 cartoon-border inline-block"></span>
            <span id="status-text">Đang chuẩn bị...</span>
          </p>
        </div>
      </div>

      <!-- USER PROFILE HEADER -->
      <div id="user-profile-header" class="hidden flex items-center gap-3">
        <div class="relative">
          <img id="header-avatar" src="" class="w-11 h-11 rounded-2xl cartoon-border bg-purple-300 object-cover" alt="Avatar">
          <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-400 cartoon-border rounded-full"></span>
        </div>
        <div class="hidden sm:block text-left">
          <div id="header-name" class="font-cartoon font-bold text-slate-900 text-sm leading-tight">...</div>
          <span class="text-[10px] bg-blue-100 text-blue-800 font-extrabold px-2 py-0.5 rounded-full border border-slate-900">Facebooker</span>
        </div>
        <button onclick="logout()" class="w-10 h-10 bg-rose-500 hover:bg-rose-400 text-white font-bold rounded-xl cartoon-border cartoon-shadow-btn flex items-center justify-center transition active:translate-y-1 ml-1" title="Đăng xuất">
          <i class="fa-solid fa-right-from-bracket text-base"></i>
        </button>
      </div>
    </header>

    <!-- BODY CONTAINER -->
    <div class="flex-1 flex overflow-hidden relative">

      <!-- LOGIN MODAL OVERLAY (DUY NHẤT FACEBOOK) -->
      <div id="login-modal" class="absolute inset-0 bg-amber-200/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-3xl cartoon-border cartoon-shadow-lg max-w-md w-full text-center relative overflow-hidden animate-pop-in">
          
          <div class="w-20 h-20 bg-blue-600 rounded-3xl cartoon-border cartoon-shadow flex items-center justify-center text-4xl text-white mx-auto mb-4 animate-float">
            <i class="fa-brands fa-facebook-f"></i>
          </div>

          <h2 class="font-cartoon text-3xl font-bold text-slate-900 mb-2">VÀO PHÒNG CHAT!</h2>
          <p class="text-slate-600 font-bold text-sm mb-6">Đăng nhập Facebook để chém gió cùng tất cả mọi người ngay lập tức 🔥</p>
          
          <button onclick="loginWithFacebook()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-cartoon text-lg font-bold py-3.5 px-6 rounded-2xl cartoon-border cartoon-shadow-btn flex items-center justify-center gap-3 transition active:translate-y-1">
            <i class="fa-brands fa-facebook-square text-2xl"></i>
            Đăng Nhập Facebook Ngay
          </button>

          <div id="login-error" class="hidden mt-4 text-xs font-bold text-red-600 bg-red-100 p-3 rounded-xl border-2 border-slate-900 text-left"></div>
        </div>
      </div>

      <!-- SIDEBAR: SERVER LIST -->
      <aside class="w-20 sm:w-60 bg-sky-200 border-r-4 border-slate-900 flex flex-col p-2 sm:p-3">
        <div class="font-cartoon text-xs text-slate-700 uppercase tracking-wider font-extrabold mb-2 px-2 hidden sm:block">
          Máy Chủ Chat
        </div>
        <div id="server-list" class="space-y-2">
          <!-- Rendered via JS -->
        </div>
      </aside>

      <!-- MAIN CHAT CONTENT -->
      <main class="flex-1 flex flex-col bg-slate-50">
        
        <!-- SERVER HEADER BAR -->
        <div class="px-4 py-2.5 bg-sky-100 border-b-4 border-slate-900 flex justify-between items-center">
          <div class="font-cartoon text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
            <span id="current-server-icon" class="text-xl">🎮</span>
            <span id="current-server-title">Server #1</span>
          </div>
          <span class="text-xs bg-emerald-300 font-extrabold text-slate-900 cartoon-border px-3 py-1 rounded-full flex items-center gap-1.5 cartoon-shadow">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-600 animate-ping"></span>
            Realtime
          </span>
        </div>

        <!-- MESSAGES CONTAINER -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto chat-scroll space-y-4">
          <div class="text-center font-cartoon text-slate-400 py-12 text-lg">
            Đang chuẩn bị phòng chat... 🚀
          </div>
        </div>

        <!-- INPUT BAR & EMOJI QUICK SELECT -->
        <div class="p-3 bg-amber-100 border-t-4 border-slate-900">
          <!-- EMOJI QUICK BAR -->
          <div class="flex gap-2 mb-2 overflow-x-auto pb-1">
            <button onclick="insertEmoji('👍')" class="bg-white hover:bg-yellow-200 text-base p-1.5 rounded-xl cartoon-border cartoon-shadow-btn animate-wiggle">👍</button>
            <button onclick="insertEmoji('❤️')" class="bg-white hover:bg-yellow-200 text-base p-1.5 rounded-xl cartoon-border cartoon-shadow-btn animate-wiggle">❤️</button>
            <button onclick="insertEmoji('😂')" class="bg-white hover:bg-yellow-200 text-base p-1.5 rounded-xl cartoon-border cartoon-shadow-btn animate-wiggle">😂</button>
            <button onclick="insertEmoji('🔥')" class="bg-white hover:bg-yellow-200 text-base p-1.5 rounded-xl cartoon-border cartoon-shadow-btn animate-wiggle">🔥</button>
            <button onclick="insertEmoji('🎉')" class="bg-white hover:bg-yellow-200 text-base p-1.5 rounded-xl cartoon-border cartoon-shadow-btn animate-wiggle">🎉</button>
            <button onclick="insertEmoji('💩')" class="bg-white hover:bg-yellow-200 text-base p-1.5 rounded-xl cartoon-border cartoon-shadow-btn animate-wiggle">💩</button>
          </div>

          <!-- INPUT FORM -->
          <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
            <input type="text" id="message-input" placeholder="Nhập tin nhắn chém gió..." autocomplete="off" class="flex-1 bg-white cartoon-border font-bold text-slate-900 px-4 py-3 rounded-2xl focus:outline-none focus:ring-4 focus:ring-blue-400 placeholder:text-slate-400 cartoon-shadow">
            <button type="submit" class="bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-cartoon font-bold px-5 sm:px-6 py-3 rounded-2xl cartoon-border cartoon-shadow-btn flex items-center justify-center gap-2 text-base">
              <span>GỬI</span>
              <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script>
    // --- FIREBASE CONFIG (ĐÃ NHÚNG CHÍNH XÁC) ---
    const firebaseConfig = {
      apiKey: "AIzaSyDC70Llo5pUsOkmDyx1mzpnlLTXyRqSkII",
      authDomain: "chatgdvn.firebaseapp.com",
      projectId: "chatgdvn",
      storageBucket: "chatgdvn.firebasestorage.app",
      messagingSenderId: "59954267016",
      appId: "1:59954267016:web:65ff7de0342188f5bdf03d",
      measurementId: "G-06XHS5VDCK"
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentServer = "server1";
    let messageUnsubscribe = null;

    const servers = [
      { id: "server1", name: "Server #1", icon: "🎮" },
      { id: "server2", name: "Server #2", icon: "🎨" },
      { id: "server3", name: "Server #3", icon: "🚀" },
      { id: "server4", name: "Server #4", icon: "🍕" },
      { id: "server5", name: "Server #5", icon: "🦄" },
    ];

    // Render danh sách Máy Chủ Cartoon
    function renderServerList() {
      const list = document.getElementById('server-list');
      list.innerHTML = servers.map(s => {
        const isActive = s.id === currentServer;
        return `
          <button onclick="switchServer('${s.id}', '${s.name}', '${s.icon}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl cartoon-border font-cartoon font-bold text-sm transition cartoon-shadow-btn ${isActive ? 'bg-pink-400 text-slate-900' : 'bg-white text-slate-700 hover:bg-yellow-200'}">
            <span class="text-xl">${s.icon}</span>
            <span class="hidden sm:inline">${s.name}</span>
          </button>
        `;
      }).join('');
    }

    // Âm thanh Pop hiệu ứng Cartoon khi nhận tin nhắn
    function playCartoonPopSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    // LẮNG NGHE TRẠNG THÁI ĐĂNG NHẬP
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-profile-header').classList.remove('hidden');
        
        document.getElementById('header-avatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'FB')}&background=f472b6&color=fff`;
        document.getElementById('header-name').innerText = user.displayName || 'Thành Viên FB';
        
        document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-emerald-400 cartoon-border inline-block";
        document.getElementById('status-text').innerText = "Đã sẵn sàng!";

        loadMessages(currentServer);
      } else {
        currentUser = null;
        document.getElementById('login-modal').classList.remove('hidden');
        document.getElementById('user-profile-header').classList.add('hidden');
        
        document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-rose-400 cartoon-border inline-block";
        document.getElementById('status-text').innerText = "Chưa đăng nhập";
      }
    });

    // ĐĂNG NHẬP FACEBOOK
    function loginWithFacebook() {
      const provider = new firebase.auth.FacebookAuthProvider();
      const errBox = document.getElementById('login-error');
      errBox.classList.add('hidden');

      auth.signInWithPopup(provider).catch(error => {
        errBox.classList.remove('hidden');
        errBox.innerText = "Lỗi đăng nhập Facebook: " + error.message;
      });
    }

    // ĐĂNG XUẤT
    function logout() {
      auth.signOut();
    }

    // ĐỔI MÁY CHỦ
    function switchServer(serverId, serverName, serverIcon) {
      currentServer = serverId;
      document.getElementById('current-server-title').innerText = serverName;
      document.getElementById('current-server-icon').innerText = serverIcon;
      renderServerList();
      loadMessages(serverId);
    }

    // LOAD TIN NHẮN REALTIME (FIRESTORE)
    function loadMessages(serverId) {
      if (messageUnsubscribe) messageUnsubscribe();

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = `<div class="text-center font-cartoon text-slate-400 py-12 text-lg">Đang kết nối tin nhắn... ⚡</div>`;

      messageUnsubscribe = db.collection(`messages_${serverId}`)
        .orderBy('timestamp', 'asc')
        .limitToLast(50)
        .onSnapshot(snapshot => {
          chatBox.innerHTML = '';
          if (snapshot.empty) {
            chatBox.innerHTML = `<div class="text-center font-cartoon text-slate-400 py-12 text-lg">Chưa có tin nhắn nào. Bật mic chém gió đầu tiên đi nào! 🎉</div>`;
            return;
          }

          snapshot.forEach(doc => {
            const msg = doc.data();
            const isMe = currentUser && msg.uid === currentUser.uid;
            
            const msgEl = document.createElement('div');
            msgEl.className = `flex items-start gap-3 animate-pop-in ${isMe ? 'flex-row-reverse' : ''}`;
            
            msgEl.innerHTML = `
              <img src="${msg.avatar || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-2xl cartoon-border bg-yellow-200 object-cover mt-1 cartoon-shadow" alt="avatar">
              <div class="max-w-[80%]">
                <div class="font-cartoon text-xs text-slate-700 font-bold mb-1 ${isMe ? 'text-right' : ''}">${msg.name || 'Thành viên'}</div>
                <div class="px-4 py-3 rounded-2xl cartoon-border font-bold text-slate-900 break-words text-sm cartoon-shadow ${isMe ? 'bg-amber-300 rounded-tr-none' : 'bg-white rounded-tl-none'}">
                  ${escapeHtml(msg.text)}
                </div>
              </div>
            `;
            chatBox.appendChild(msgEl);
          });

          chatBox.scrollTop = chatBox.scrollHeight;
          playCartoonPopSound();
        }, err => {
          chatBox.innerHTML = `<div class="text-center font-cartoon text-rose-500 py-12 text-base">Lỗi kết nối CSDL: ${err.message}</div>`;
        });
    }

    // GỬI TIN NHẮN
    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      input.value = '';

      db.collection(`messages_${currentServer}`).add({
        uid: currentUser.uid,
        name: currentUser.displayName || 'Thành viên Facebook',
        avatar: currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || 'FB')}&background=f472b6&color=fff`,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(err => {
        alert("Không thể gửi tin nhắn: " + err.message);
      });
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('message-input');
      input.value += emoji;
      input.focus();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Khởi chạy UI ban đầu
    renderServerList();
  </script>
</body>
</html>
